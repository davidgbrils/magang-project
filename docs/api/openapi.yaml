openapi: 3.1.0
info:
  title: ITCC Wisuda Sync API
  version: 1.0.0
  description: REST contract for authenticated graduation synchronization.
servers:
  - url: /api
paths:
  /me:
    get:
      summary: Current authenticated profile
      responses: { '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /session:
    get:
      summary: Current session metadata
      responses: { '200': { description: Session }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /graduation-uploads:
    post:
      summary: Upload a graduation workbook
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '202': { description: Upload validation queued, content: { application/json: { schema: { $ref: '#/components/schemas/GraduationUpload' } } } }, '400': { $ref: '#/components/responses/ValidationError' } }
    get:
      summary: List caller uploads
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { $ref: '#/components/responses/PaginatedUploads' } }
  /graduation-uploads/{uploadId}:
    get:
      summary: Get one owned upload
      parameters: [ { $ref: '#/components/parameters/UploadId' } ]
      responses: { '200': { description: Upload, content: { application/json: { schema: { $ref: '#/components/schemas/GraduationUpload' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /graduation-uploads/{uploadId}/validation:
    get:
      summary: Get workbook validation and sheet report
      parameters: [ { $ref: '#/components/parameters/UploadId' } ]
      responses: { '200': { description: Validation report, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationReport' } } } } }
  /reference-batches:
    get:
      summary: List reference batches
      parameters: [ { name: sourceType, in: query, schema: { type: string, enum: [SITASI, CERTIPORT] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { $ref: '#/components/responses/PaginatedBatches' } }
  /reference-batches/active:
    get:
      summary: Get active SITASI and Certiport batches
      responses: { '200': { description: Active batches, content: { application/json: { schema: { type: object, properties: { sitasi: { $ref: '#/components/schemas/ReferenceBatch' }, certiport: { $ref: '#/components/schemas/ReferenceBatch' } } } } } } }
  /sync-jobs:
    post:
      summary: Trigger deterministic synchronization
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [graduationUploadId, sitasiBatchId, certiportBatchId], properties: { graduationUploadId: { type: string, format: uuid }, sitasiBatchId: { type: string, format: uuid }, certiportBatchId: { type: string, format: uuid } } } } } }
      responses: { '202': { description: Job queued, content: { application/json: { schema: { $ref: '#/components/schemas/SyncJob' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /sync-jobs/{jobId}:
    get:
      summary: Get owned job status and progress
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses: { '200': { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/SyncJob' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /sync-jobs/{jobId}/rows:
    get:
      summary: List job row decisions
      parameters: [ { $ref: '#/components/parameters/JobId' }, { name: status, in: query, schema: { $ref: '#/components/schemas/RowStatus' } }, { name: search, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { $ref: '#/components/responses/PaginatedRows' } }
  /sync-jobs/{jobId}/preview:
    get:
      summary: Preview manifest before output generation
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses: { '200': { description: Manifest, content: { application/json: { schema: { type: object, properties: { changes: { type: array, items: { $ref: '#/components/schemas/SyncRow' } } } } } } } }
  /sync-jobs/{jobId}/generate-output:
    post:
      summary: Generate output after all required reviews
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses: { '202': { description: Output generation queued, content: { application/json: { schema: { $ref: '#/components/schemas/GeneratedOutput' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /sync-rows/{rowId}/review:
    post:
      summary: Submit a manual review decision for an owned row
      parameters: [ { name: rowId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { $ref: '#/components/schemas/ReviewStatus' }, note: { type: string, maxLength: 1000 } } } } } }
      responses: { '200': { description: Saved review, content: { application/json: { schema: { $ref: '#/components/schemas/SyncRow' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /outputs/{outputId}/download:
    get:
      summary: Get a short-lived authorized output URL
      parameters: [ { name: outputId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Authorized URL, content: { application/json: { schema: { type: object, required: [url, expiresAt], properties: { url: { type: string, format: uri }, expiresAt: { type: string, format: date-time } } } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/reference-batches/sitasi:
    post: { summary: Admin import SITASI, requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file, period], properties: { file: { type: string, format: binary }, period: { type: string } } } } } }, responses: { '202': { description: Import queued }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /admin/reference-batches/certiport:
    post: { summary: Admin import Certiport, requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file, period], properties: { file: { type: string, format: binary }, period: { type: string } } } } } }, responses: { '202': { description: Import queued }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /admin/reference-batches/{batchId}/activate:
    post: { summary: Activate a reference batch, parameters: [ { name: batchId, in: path, required: true, schema: { type: string, format: uuid } } ], responses: { '200': { description: Activated }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /admin/users:
    get: { summary: Admin list users, parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ], responses: { '200': { description: Users }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /admin/audit-logs:
    get: { summary: Admin list audit events, parameters: [ { name: action, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ], responses: { '200': { description: Audit logs }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /admin/matching-rules:
    get: { summary: Admin list matching rules, responses: { '200': { description: Rules }, '403': { $ref: '#/components/responses/Forbidden' } } }
components:
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    UploadId: { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Insufficient role or ownership, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Entity not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Invalid state transition, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationError: { description: Invalid request or workbook, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PaginatedUploads: { description: Upload page }
    PaginatedBatches: { description: Reference batch page }
    PaginatedRows: { description: Sync row page }
  schemas:
    Profile: { type: object, required: [id, email, role], properties: { id: { type: string, format: uuid }, email: { type: string, format: email }, displayName: { type: string }, role: { type: string, enum: [USER, ADMIN] } } }
    GraduationUpload: { type: object, required: [id, status, sheetCount], properties: { id: { type: string, format: uuid }, status: { type: string, enum: [UPLOADED, VALIDATING, VALID, INVALID, FAILED] }, sheetCount: { type: integer }, studentCount: { type: integer } } }
    ReferenceBatch: { type: object, required: [id, sourceType, status], properties: { id: { type: string, format: uuid }, sourceType: { type: string, enum: [SITASI, CERTIPORT] }, period: { type: string }, status: { type: string }, isActive: { type: boolean } } }
    SyncJob: { type: object, required: [id, status, progress], properties: { id: { type: string, format: uuid }, status: { type: string, enum: [UPLOADED, VALIDATING, PROCESSING, READY_FOR_REVIEW, COMPLETED, FAILED] }, currentStage: { type: string }, progress: { type: number }, totalRows: { type: integer }, processedRows: { type: integer }, readyCount: { type: integer }, reviewCount: { type: integer }, failedCount: { type: integer } } }
    RowStatus: { type: string, enum: [READY, NEEDS_REVIEW, NOT_FOUND_IN_SITASI, SITASI_NOT_GRADUATED, CERTIPORT_NOT_FOUND, DUPLICATE_NIM, EXCLUDED_MCF_PROGRAM, FAILED] }
    ReviewStatus: { type: string, enum: [CONFIRMED, REJECTED, SKIPPED] }
    SyncRow: { type: object, properties: { id: { type: string, format: uuid }, sheetName: { type: string }, sourceRow: { type: integer }, nim: { type: string }, nama: { type: string }, resultStatus: { $ref: '#/components/schemas/RowStatus' }, mosValue: { type: [string, 'null'] }, titleValue: { type: [string, 'null'] }, reasonCodes: { type: array, items: { type: string } } } }
    GeneratedOutput: { type: object, properties: { id: { type: string, format: uuid }, status: { type: string }, fileName: { type: string } } }
    ValidationReport: { type: object, properties: { status: { type: string }, sheets: { type: array, items: { type: object } }, errors: { type: array, items: { type: string } } } }
    ErrorResponse: { type: object, required: [error], properties: { error: { type: object, required: [code, message, requestId], properties: { code: { type: string }, message: { type: string }, fields: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }, requestId: { type: string, format: uuid } } } } }
